name: NetSpeedLite
options:
  bundleIdPrefix: com.netspeedlite
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  NetSpeedLite:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
      - path: NetSpeedLiteApp
    info:
      path: NetSpeedLiteApp/Info.plist
    entitlements:
      path: NetSpeedLiteApp/NetSpeedLite.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netspeedlite.ios
        PRODUCT_NAME: NetSpeedLite
        INFOPLIST_FILE: NetSpeedLiteApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetSpeedLiteApp/NetSpeedLite.entitlements
    dependencies:
      - target: NetSpeedLiteWidget

  NetSpeedLiteWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
      - path: NetSpeedLiteWidget
    info:
      path: NetSpeedLiteWidget/Info.plist
    entitlements:
      path: NetSpeedLiteWidget/NetSpeedLiteWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netspeedlite.ios.widget
        PRODUCT_NAME: NetSpeedLiteWidget
        INFOPLIST_FILE: NetSpeedLiteWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: NetSpeedLiteWidget/NetSpeedLiteWidget.entitlements
        SKIP_INSTALL: YES
    frameworks:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
